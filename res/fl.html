<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速搜索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a13;--panel:rgba(16,16,34,.72);--box:rgba(20,20,44,.6);--line:rgba(0,229,255,.18);--line-hover:rgba(0,229,255,.5);--cyan:#00e5ff;--magenta:#ff2d95;--purple:#b06cff;--text:#e8e8f0;--dim:#8f8fa8;--faint:#666680}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani','Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 16px 24px}
.wrap{width:100%;max-width:1120px}
.big-title{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:4px;color:#eaf6ff;text-shadow:0 0 12px rgba(0,229,255,.55);text-align:center;margin-bottom:24px}
.panel{background:var(--panel);border:1px solid rgba(0,229,255,.28);border-radius:14px;padding:18px;box-shadow:0 0 24px rgba(0,229,255,.10),inset 0 0 18px rgba(0,229,255,.04)}
.cat-boxes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.cat-box{flex:1 1 200px;min-width:0;max-width:100%;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .2s,box-shadow .2s;overflow:hidden}
.cat-box:hover{border-color:var(--line-hover);box-shadow:0 0 14px rgba(0,229,255,.12)}
.cat-box__head{display:flex;align-items:center;gap:6px;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid rgba(176,108,255,.18)}
.cat-box__title{flex:1;min-width:0;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:1px;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-box__engines{display:flex;flex-wrap:wrap;gap:6px}
.eng{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.4px;color:#a8a8c0;background:rgba(255,255,255,.04);border:1px solid rgba(140,140,180,.3);border-radius:999px;padding:4px 10px;cursor:pointer;transition:all .2s;user-select:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng:hover{color:#fff;border-color:rgba(0,229,255,.6)}
.eng.on{color:#ffd9ec;background:rgba(255,45,149,.14);border-color:var(--magenta);box-shadow:0 0 10px rgba(255,45,149,.35)}
.search-row{display:flex;gap:10px;align-items:center}
.search-box{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:#0d0d1c;border:1px solid rgba(0,229,255,.45);border-radius:999px;padding:0 18px;transition:box-shadow .2s}
.search-box:focus-within{box-shadow:0 0 16px rgba(0,229,255,.35)}
.search-box svg{flex:none;width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round}
#q{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;color:#eef6ff;font-family:'Rajdhani',sans-serif;font-size:1.05rem;letter-spacing:.4px;padding:13px 0}
#q::placeholder{color:#5c5c78;font-size:.95rem}
#go{flex:none;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:2px;color:#04222b;background:var(--cyan);border:none;border-radius:999px;padding:12px 24px;cursor:pointer;transition:all .2s;box-shadow:0 0 14px rgba(0,229,255,.4)}
#go:hover{background:#35eaff;box-shadow:0 0 22px rgba(0,229,255,.7)}
#go:active{transform:scale(.97)}
.extra{display:none;margin-top:12px;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}
.extra.show{display:flex}
.extra .pgroup{display:flex;align-items:center;gap:6px;background:#0d0d1c;border:1px solid rgba(255,45,149,.35);border-radius:999px;padding:5px 14px}
.extra .pgroup label{font-size:.72rem;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
.extra .pgroup input{width:150px;max-width:60vw;background:transparent;border:none;outline:none;color:#eef6ff;font-family:'Rajdhani',sans-serif;font-size:.9rem;padding:3px 0}
.extra .pgroup input:focus{color:#fff}
.extra .pgroup:focus-within{border-color:var(--magenta);box-shadow:0 0 10px rgba(255,45,149,.3)}
.links{margin-top:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:rgba(16,16,34,.6);border:1px solid rgba(0,229,255,.12);border-radius:10px;padding:14px 16px;transition:all .2s;min-width:0;overflow:hidden}
.card:hover{border-color:rgba(0,229,255,.4);box-shadow:0 0 14px rgba(0,229,255,.12)}
.card .card-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card h3{flex:1;min-width:0;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:1px;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card a{display:block;font-size:.88rem;color:#7de8ff;text-decoration:none;padding:3px 0;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card a:hover{color:#ff9d5c;padding-left:4px}
footer{margin-top:40px;text-align:center;font-size:.72rem;color:#4c4c64;line-height:1.9}
footer a{color:#5c5c78;text-decoration:none}
footer a:hover{color:var(--cyan)}
@media(min-width:1200px){body{padding:48px 24px 28px}.big-title{font-size:2rem}}
@media(max-width:900px){body{padding:32px 14px 22px}.big-title{font-size:1.6rem;margin-bottom:20px}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}footer{margin-top:32px}}
@media(max-width:560px){body{padding:20px 10px 16px}.big-title{font-size:1.3rem;letter-spacing:2px;margin-bottom:16px}.panel{padding:12px}.cat-boxes{gap:8px;margin-top:12px}.cat-box{padding:8px 10px}.cat-box__title{font-size:.64rem}.cat-box__engines{gap:4px}.eng{font-size:.54rem;padding:3px 8px;letter-spacing:.2px}.search-row{gap:8px}.search-box{padding:0 12px}#q{font-size:.95rem;padding:11px 0}#q::placeholder{font-size:.85rem}#go{padding:10px 16px;font-size:.64rem;letter-spacing:1px}.extra{gap:8px;margin-top:10px}.extra .pgroup{padding:4px 10px}.extra .pgroup label{font-size:.64rem}.extra .pgroup input{width:110px;max-width:52vw;font-size:.82rem}.links{margin-top:26px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.card{padding:10px 12px}.card a{font-size:.8rem}footer{font-size:.64rem;margin-top:28px}}
@media(max-width:380px){.big-title{font-size:1.15rem}#q{font-size:.88rem}#go{padding:9px 13px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h2 class="big-title">快速搜索</h2>
  <div class="panel">
    <form id="searchForm" method="GET" target="_blank">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
          <input id="q" type="text" autocomplete="off" placeholder="输入搜索项搜索" maxlength="500">
        </div>
        <button id="go" type="submit">搜索</button>
      </div>
      <div class="extra" id="extraWrap"></div>
    </form>
    <div class="cat-boxes" id="catBoxes"></div>
  </div>
  <div class="links">
    <h2 class="big-title">常用链接</h2>
    <div class="grid" id="linkGrid"></div>
  </div>
  <footer>
    <p>方舟未来 | 方舟未来工作室/集团/团队 | 方舟实验室</p>
    <p>Copyright &copy; 2020-&infin; <a href="/index.html">ARKFUTURE</a> | <a href="arkfuturestudio.html">ARKFUTURE STUDIO/GROUP/TEAM</a> | <a href="arklab.html">ARK LAB</a>. All rights reserved.</p>
    <p>All trademarks and resources are the property of their respective owners.</p>
    <p>----ALL by ARKFUTURE Management and Operation Working Group</p>
  </footer>
</div>
<script>
const DATA = {
  '搜索引擎': {
    '百度': ['https://www.baidu.com/s?wd={q}', '搜索项'],
    '必应': ['https://cn.bing.com/search?q={q}', '搜索项'],
    '谷歌': ['https://www.google.com/search?q={q}', '搜索项'],
    'Yandex': ['https://yandex.com/search?text={q}', '搜索项'],
    'DuckDuckGo': ['https://duckduckgo.com/?q={q}', '搜索项'],
    'Qwant': ['https://qwant.com/?q={q}', '搜索项'],
    'Shodan': ['https://www.shodan.io/search?query={q}', '搜索项']
  },
  'DARKNET搜索': {
    'TorDex': ['http://tordexu73joywapk2txdr54jed4imqledpcvcuf75qsas2gwdgksvnyd.onion/search?query={q}', '搜索项'],
    'OnDex': ['http://ondexcylxxxq6vcc62l3r2m6rypohvvymsvqeadhln5mjo73pf6ksjad.onion?query={q}', '搜索项'],
    'TOR.LINK': ['https://tor.link/?q={q}', '搜索项'],
    'OnionLand': ['https://onionlandsearchengine.net/search?q={q}', '搜索项'],
    'I2P': ['https://i2psearch.com/search?q={q}', '搜索项']
  },
  'XDCC搜索': {
    'xdcc.eu': ['https://www.xdcc.eu/search.php?searchkey={q}', '搜索项'],
    'NIBL': ['https://nibl.co.uk/search?query={q}', '搜索项'],
    'animk': ['https://xdcc.animk.info/?search={q}', '搜索项'],
    'lib.rs': ['https://lib.rs/search?q={q}', '搜索项'],
    'sunxdcc': ['https://sunxdcc.com/deliver.php?sterm={q}&page={p}&name={n}', '搜索项', '页数', '名称'],
    'skull': ['https://skullxdcc.com/ws.php?sterm={q}', '搜索项'],
    'xdcc.rocks': ['https://www.xdcc.rocks/search/?searchword={q}', '搜索项'],
    'xdcc-search': ['https://xdcc-search.com/?q={q}', '搜索项']
  },
  '软件包搜索': {
    'repology': ['https://repology.org/projects/?search={a}&maintainer={b}&category={c}&inrepo={d}&notinrepo={e}&repos={f}&families={g}&repos_newest={h}&families_newest={i}', '软件包名', '维护者', '软件分类', '仓库中存在', '仓库中缺失', '仓库来源', '仓库家族', '拥有最新版的仓库', '拥有最新版的家族'],
    'msys2': ['https://packages.msys2.org/search?q={q}&t=pkg', '搜索项']
  },
  '学术/论文搜索': {
    'Scirp': ['https://www.scirp.org/journal/articles.aspx?searchcode={q}', '搜索项'],
    'Scielo': ['https://search.scielo.org/?q={q}', '搜索项'],
    'Arxiv': ['https://arxiv.org/search/?query={q}', '搜索项']
  },
  '英汉词典': {
    '金山词霸': ['https://www.iciba.com/word?w={q}', '搜索项'],
    'WordNet': ['http://wordnetweb.princeton.edu/perl/webwn?s={q}', '搜索项'],
    'Urban Dictionary': ['https://www.urbandictionary.com/define.php?term={q}', '搜索项']
  },
  '电台搜索': {
    'radio-browser 名字': ['http://de1.api.radio-browser.info/xml/stations/search?name={q}&order={p}', '搜索项', '排序方式'],
    'radio-browser UUID': ['http://de1.api.radio-browser.info/xml/stations/byuuid?uuids={q}', 'UUID']
  },
  '视频逃逸': {
    '视频解析': ['https://jx.xmflv.com/?url={q}', '视频链接']
  }
};
const LINKS = {
  '操作系统': {
    'ParrotSec': 'https://parrotsec.org',
    'BlackArch': 'https://blackarch.org',
    'Debian': 'https://www.debian.org',
    'OpenMediaVault': 'https://www.openmediavault.org',
    'OpenWrt': 'https://openwrt.org',
    'ImmortalWrt': 'https://firmware-selector.immortalwrt.org',
    'UUP dump': 'https://uupdump.net'
  },
  'NTP 授时': {
    '国家授时中心 NTP': 'http://ntp.ntsc.ac.cn',
    '中国 NTP 快速授时': 'http://cn.ntp.org.cn',
    '教育网专用 NTP': 'http://edu.ntp.org.cn'
  },
  'Tracker': {
    'OpenTracker': 'http://opentrackr.org',
    'TrackersList': 'https://trackerslist.com'
  },
  'DNS': {
    '阿里云 DoT': 'tls://dns.alidns.com',
    '腾讯云 DoT': 'tls://dot.pub',
    'Cloudflare DoT': 'tls://1dot1dot1dot1.cloudflare-dns.com',
    'Cloudflare DoH': 'https://1.0.0.1/dns-query',
    'OpenDNS DoH': 'https://doh.opendns.com/dns-query'
  }
};
const boxEl = document.getElementById('catBoxes');
const gridEl = document.getElementById('linkGrid');
const form = document.getElementById('searchForm');
const q = document.getElementById('q');
const extraWrap = document.getElementById('extraWrap');
let curEng = null;
function parseEntry(v){
  const tpl = String(Array.isArray(v) ? v[0] : v || '');
  const labels = Array.isArray(v) ? v.slice(1).map(String) : [];
  const phs = [];
  const re = /\{([^{}]+)\}/g;
  let m;
  while((m = re.exec(tpl)) !== null){
    phs.push({ name: m[1], label: labels[phs.length] || m[1] });
  }
  return { tpl, phs };
}
function renderBoxes(){
  boxEl.innerHTML = '';
  Object.keys(DATA).forEach(cat=>{
    const list = DATA[cat];
    if(!list || typeof list !== 'object') return;
    const entries = Object.entries(list).map(([n, v])=> [n, parseEntry(v)]).filter(([n, e])=> n && e.phs.length > 0);
    const box = document.createElement('div');
    box.className = 'cat-box';
    const head = document.createElement('div');
    head.className = 'cat-box__head';
    const title = document.createElement('div');
    title.className = 'cat-box__title';
    title.textContent = cat;
    head.appendChild(title);
    const engs = document.createElement('div');
    engs.className = 'cat-box__engines';
    if(entries.length === 0){
      const empty = document.createElement('span');
      empty.style.cssText = 'font-size:.7rem;color:#666680';
      empty.textContent = '暂无搜索项';
      engs.appendChild(empty);
    }
    entries.forEach(([name, e])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'eng' + (curEng && curEng.name === name && curEng.cat === cat ? ' on' : '');
      b.textContent = name;
      b.title = e.tpl + (e.phs.length > 1 ? '(参数: ' + e.phs.slice(1).map(p=> p.label).join(' / ') + ')' : '');
      b.onclick = ()=>{ curEng = {name, tpl: e.tpl, phs: e.phs, cat}; refresh(); };
      engs.appendChild(b);
    });
    box.appendChild(head);
    box.appendChild(engs);
    boxEl.appendChild(box);
  });
}
function renderLinks(){
  gridEl.innerHTML = '';
  Object.keys(LINKS).forEach(cat=>{
    const list = LINKS[cat];
    if(!list || typeof list !== 'object') return;
    const entries = Object.entries(list).filter(([n, url])=> n && typeof url === 'string');
    const card = document.createElement('div');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'card-head';
    const h3 = document.createElement('h3');
    h3.textContent = cat;
    head.appendChild(h3);
    card.appendChild(head);
    if(entries.length === 0){
      const empty = document.createElement('span');
      empty.style.cssText = 'font-size:.72rem;color:#666680';
      empty.textContent = '暂无链接';
      card.appendChild(empty);
    }
    entries.forEach(([name, url])=>{
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = name;
      a.title = url;
      card.appendChild(a);
    });
    gridEl.appendChild(card);
  });
}
function refresh(){
  renderBoxes();
  if(!curEng) return;
  q.placeholder = curEng.name;
  extraWrap.innerHTML = '';
  if(curEng.phs.length > 1){
    extraWrap.classList.add('show');
    curEng.phs.slice(1).forEach(ph=>{
      const group = document.createElement('div');
      group.className = 'pgroup';
      const label = document.createElement('label');
      label.textContent = ph.label + ' ';
      const input = document.createElement('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.maxLength = 200;
      input.placeholder = '此参数为可选项';
      input.dataset.ph = ph.name;
      group.appendChild(label);
      group.appendChild(input);
      extraWrap.appendChild(group);
    });
  } else {
    extraWrap.classList.remove('show');
  }
}
function buildUrl(tpl, values){
  let url = tpl;
  Object.keys(values).forEach(ph=>{
    const v = values[ph];
    if(v !== undefined && v !== null && String(v).trim() !== ''){
      url = url.split('{' + ph + '}').join(encodeURIComponent(String(v).trim()));
    }
  });
  url = url.replace(/[?&][^=&]*=\{[^{}]*\}/g, '');
  url = url.replace(/[?&]/, '?');
  url = url.replace(/[?&]$/, '');
  return url;
}
form.addEventListener('submit', function(ev){
  ev.preventDefault();
  if(!curEng) return;
  const kw = q.value.trim();
  if(!kw) return;
  const values = {};
  values[curEng.phs[0].name] = kw;
  extraWrap.querySelectorAll('input').forEach(inp=>{
    values[inp.dataset.ph] = inp.value;
  });
  window.open(buildUrl(curEng.tpl, values), '_blank');
});
(function init(){
  const firstCat = Object.keys(DATA)[0];
  const first = firstCat && Object.keys(DATA[firstCat] || {})[0];
  if(firstCat && first){
    const e0 = parseEntry(DATA[firstCat][first]);
    if(e0.phs.length > 0){
      curEng = {name: first, tpl: e0.tpl, phs: e0.phs, cat: firstCat};
    }
  }
  renderBoxes();
  renderLinks();
  refresh();
  const urlParams = new URLSearchParams(location.search);
  const urlQ = (urlParams.get('q') || '').trim();
  if(urlQ && curEng){
    const urlE = (urlParams.get('e') || '').trim();
    if(urlE){
      let found = null;
      Object.keys(DATA).forEach(cat=>{
        const list = DATA[cat];
        if(list && typeof list === 'object' && list[urlE]){
          found = {cat, name: urlE};
        }
      });
      if(found){
        const e0 = parseEntry(DATA[found.cat][found.name]);
        if(e0.phs.length > 0){
          curEng = {name: found.name, tpl: e0.tpl, phs: e0.phs, cat: found.cat};
          refresh();
        }
      }
    }
    q.value = urlQ;
    const values = {};
    values[curEng.phs[0].name] = urlQ;
    window.open(buildUrl(curEng.tpl, values), '_blank');
  }
})();
</script>
</body>
</html>
