<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ARKFUTURE 服务器配置文件下载">
<meta name="theme-color" content="#05060f">
<title>配置索引 | ARKFUTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ARKFUTURE 配置页 — 霓虹赛博朋克主题
   Single-file build · data-driven DOM · accessibility-first
   ============================================================ */
:root {
  --neon-cyan: #00F0FF;
  --neon-magenta: #B026FF;
  --neon-green: #00FF88;
  --neon-orange: #FF9E00;
  --neon-yellow: #F0FF00;
  --neon-red: #FF3B5C;

  --bg-deep: #05060f;
  --bg-surface: #080a18;
  --bg-card: #0b0d1e;
  --border-color: #141832;
  --border-bright: rgba(0, 240, 255, 0.35);

  --text-primary: #DCE3FF;
  --text-dim: rgba(220, 227, 255, 0.55);
  --text-bright: #FFFFFF;

  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius: 10px;
  --radius-lg: 16px;

  --glow-cyan: 0 0 6px rgba(0, 240, 255, 0.55), 0 0 18px rgba(0, 240, 255, 0.22);
  --glow-magenta: 0 0 6px rgba(176, 38, 255, 0.55), 0 0 18px rgba(176, 38, 255, 0.22);
  --glow-green: 0 0 6px rgba(0, 255, 136, 0.55), 0 0 18px rgba(0, 255, 136, 0.22);
  --glow-orange: 0 0 6px rgba(255, 158, 0, 0.5), 0 0 16px rgba(255, 158, 0, 0.2);
  --glow-yellow: 0 0 6px rgba(240, 255, 0, 0.5), 0 0 16px rgba(240, 255, 0, 0.18);
  --glow-red: 0 0 6px rgba(255, 59, 92, 0.5), 0 0 16px rgba(255, 59, 92, 0.2);

  --grid-opacity: 0.05;
  --scanline-opacity: 0.035;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  font-size: 1.02rem;
  line-height: 1.7;
  color: var(--text-primary);
  background:
    radial-gradient(ellipse at 12% 15%, rgba(0, 240, 255, 0.06) 0%, transparent 48%),
    radial-gradient(ellipse at 88% 82%, rgba(176, 38, 255, 0.06) 0%, transparent 48%),
    radial-gradient(ellipse at 50% -10%, rgba(0, 255, 136, 0.04) 0%, transparent 55%),
    linear-gradient(180deg, #05060f 0%, #0a0c20 100%);
  background-attachment: fixed;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
}

/* Cyber grid overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(0, 240, 255, var(--grid-opacity)) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(0, 240, 255, var(--grid-opacity)) 0 1px, transparent 1px 40px);
  pointer-events: none;
  z-index: 0;
}

/* Scanline sweep */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 240, 255, var(--scanline-opacity)) 3px 4px);
  pointer-events: none;
  z-index: 10;
  animation: scan 7s linear infinite;
}

@keyframes scan {
  from { transform: translateY(0); }
  to { transform: translateY(4px); }
}

#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

::selection {
  background: rgba(0, 240, 255, 0.25);
  color: #fff;
}

:focus-visible {
  outline: 2px solid var(--neon-cyan);
  outline-offset: 3px;
  border-radius: 2px;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1000px;
  padding: var(--space-6) var(--space-5) var(--space-7);
}

/* Accessibility helper */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Hero */
.hero {
  text-align: center;
  padding: var(--space-7) var(--space-5) var(--space-6);
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 0 0 var(--radius) var(--radius);
  background:
    linear-gradient(180deg, rgba(11, 13, 30, 0.92), rgba(8, 10, 24, 0.92)),
    radial-gradient(ellipse at 50% 0%, rgba(0, 240, 255, 0.08), transparent 60%);
  box-shadow: 0 0 40px rgba(0, 240, 255, 0.08), inset 0 0 80px rgba(0, 240, 255, 0.03);
  position: relative;
  overflow: hidden;
}

.hero::before,
.hero::after {
  content: '';
  position: absolute;
  width: 26px;
  height: 26px;
  border: 2px solid var(--neon-magenta);
  filter: drop-shadow(0 0 8px rgba(176, 38, 255, 0.6));
}
.hero::before {
  top: -2px;
  left: -2px;
  border-right: none;
  border-bottom: none;
}
.hero::after {
  bottom: -2px;
  right: -2px;
  border-left: none;
  border-top: none;
}

.eyebrow {
  font-family: var(--font-display);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--neon-green);
  text-shadow: var(--glow-green);
  margin-bottom: var(--space-4);
  animation: blink 2.4s var(--ease) infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5.2vw, 3.2rem);
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--neon-cyan);
  text-shadow: 0 0 12px rgba(0, 240, 255, 0.5), 0 0 32px rgba(0, 240, 255, 0.2);
  margin-bottom: var(--space-3);
}

.hero .subtitle {
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--neon-magenta);
  text-shadow: var(--glow-magenta);
}

.badge-line {
  margin-top: var(--space-5);
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: var(--space-3);
  font-family: var(--font-display);
  font-size: 0.68rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.badge {
  padding: var(--space-1) var(--space-3);
  border: 1px solid currentColor;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.02);
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
}
.badge:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.05);
}

/* Neon text color system (driven by JS data) */
.type-cyan { color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
.type-green { color: var(--neon-green); text-shadow: var(--glow-green); }
.type-orange { color: var(--neon-orange); text-shadow: var(--glow-orange); }
.type-magenta { color: var(--neon-magenta); text-shadow: var(--glow-magenta); }
.type-yellow { color: var(--neon-yellow); text-shadow: var(--glow-yellow); }
.type-red { color: var(--neon-red); text-shadow: var(--glow-red); }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  margin: var(--space-6) 0;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
}
.divider__core {
  width: 8px;
  height: 8px;
  transform: rotate(45deg);
  background: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

/* Card system */
.card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background: rgba(11, 13, 30, 0.85);
  padding: var(--space-6) var(--space-6) var(--space-5);
  margin-bottom: var(--space-5);
  transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
}
.card:hover {
  border-color: var(--border-bright);
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.06), inset 0 0 60px rgba(0, 240, 255, 0.02);
}

.card__title {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  margin-bottom: var(--space-5);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid rgba(0, 240, 255, 0.18);
}
.card__title::before {
  content: '>';
  color: var(--neon-green);
  text-shadow: var(--glow-green);
  font-weight: 900;
}

/* Intro list */
.intro-list {
  list-style: none;
  display: grid;
  gap: var(--space-3);
}
.intro-list li {
  position: relative;
  padding-left: var(--space-5);
  color: var(--text-dim);
  font-size: 0.98rem;
  transition: color 0.25s var(--ease);
}
.intro-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.72em;
  width: 12px;
  height: 2px;
  background: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
  transition: width 0.25s var(--ease);
}
.intro-list li:hover {
  color: var(--text-primary);
}
.intro-list li:hover::before {
  width: 20px;
}
.intro-list strong {
  color: var(--neon-orange);
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 158, 0, 0.4);
}

/* Config table */
.config-table {
  width: 100%;
  border-collapse: collapse;
}
.config-table thead th {
  font-family: var(--font-display);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--neon-yellow);
  text-shadow: var(--glow-yellow);
  text-align: left;
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid rgba(0, 240, 255, 0.4);
}
.config-table tbody td {
  padding: var(--space-4);
  border-bottom: 1px solid rgba(20, 24, 50, 0.6);
  vertical-align: middle;
  transition: background 0.25s var(--ease);
}
.config-table tbody tr {
  transition: background 0.25s var(--ease), transform 0.25s var(--ease);
}
.config-table tbody tr:hover {
  background: rgba(0, 240, 255, 0.04);
}
.config-table tbody tr:hover td:first-child {
  transform: translateX(4px);
}

.config-name {
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.config-desc {
  color: var(--text-dim);
  font-size: 0.94rem;
  max-width: 340px;
}
.type-tag {
  font-family: var(--font-display);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
}
.config-link {
  color: var(--neon-cyan);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 0.3px;
  word-break: break-all;
  position: relative;
  transition: color 0.2s var(--ease), text-shadow 0.2s var(--ease);
}
.config-link::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 1px;
  background: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
  transition: width 0.3s var(--ease);
}
.config-link:hover {
  color: #ffffff;
  text-shadow: var(--glow-cyan);
}
.config-link:hover::after {
  width: 100%;
}

/* Audit card */
.audit {
  border: 1px solid rgba(176, 38, 255, 0.35);
  background:
    linear-gradient(180deg, rgba(16, 12, 30, 0.9), rgba(11, 13, 30, 0.9)),
    radial-gradient(ellipse at 50% 0%, rgba(176, 38, 255, 0.07), transparent 60%);
  box-shadow: 0 0 28px rgba(176, 38, 255, 0.07);
}
.audit .card__title {
  color: var(--neon-magenta);
  text-shadow: var(--glow-magenta);
  border-bottom-color: rgba(176, 38, 255, 0.2);
}
.audit p {
  color: var(--text-dim);
  line-height: 1.9;
  font-size: 0.98rem;
}
.audit .emphasis {
  font-family: var(--font-display);
  font-size: 0.82rem;
  letter-spacing: 1px;
  color: var(--neon-magenta);
  text-shadow: var(--glow-magenta);
}
.audit a {
  color: var(--neon-cyan);
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: text-shadow 0.2s var(--ease);
}
.audit a:hover {
  text-shadow: var(--glow-cyan);
}

/* Footer */
.footer {
  text-align: center;
  padding: var(--space-5) var(--space-4);
  color: var(--text-dim);
  font-size: 0.78rem;
  letter-spacing: 1.5px;
}
.footer .accent {
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
}
.footer .status {
  color: var(--neon-green);
  text-shadow: var(--glow-green);
}
.footer .heartbeat {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: var(--glow-green);
  animation: pulse 2s var(--ease) infinite;
  margin-right: var(--space-1);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.6; }
}

/* Responsive */
@media (max-width: 768px) {
  body {
    font-size: 0.95rem;
  }
  .container {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }
  .hero {
    padding: var(--space-6) var(--space-4) var(--space-5);
  }
  .card {
    padding: var(--space-5) var(--space-4) var(--space-4);
  }
  .config-name {
    white-space: normal;
  }
  .config-table thead {
    display: none;
  }
  .config-table tbody tr {
    display: block;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .config-table tbody tr:hover {
    transform: none;
  }
  .config-table tbody tr:hover td:first-child {
    transform: none;
  }
  .config-table tbody td {
    display: block;
    padding: var(--space-2) 0;
    border: none;
  }
  .config-table tbody td::before {
    content: attr(data-label) ': ';
    display: inline-block;
    width: 84px;
    font-family: var(--font-display);
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--neon-yellow);
  }
  .config-name {
    display: block;
    font-size: 1.02rem;
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    padding-bottom: var(--space-2);
    margin-bottom: var(--space-2);
  }
}

/* Reduced motion: disable decorative animation */
@media (prefers-reduced-motion: reduce) {
  body::after,
  #particle-canvas {
    display: none;
  }
  .eyebrow,
  .footer .heartbeat {
    animation: none;
  }
  * {
    animation: none !important;
    transition: none !important;
  }
  html {
    scroll-behavior: auto;
  }
}
</style>
</head>
<body>
<canvas id="particle-canvas" aria-hidden="true"></canvas>
<main class="container" id="app"></main>
<script>
(function () {
  'use strict';

  /* ============================================================
   * DATA LAYER — single source of truth for all editable content.
   * Add / remove / reorder entries here; DOM rebuilds itself.
   * ============================================================ */

  var BASE_URL = 'https://github.com/ARKFUTURE/ARKFUTURE.github.io/tree/main';

  var INTRO = {
    title: '使用说明',
    lines: [
      '本页面提供所有 <strong>ARKFUTURE</strong> 服务器配置文件的下载入口。',
      '所有配置均基于 <strong>最新 Debian 稳定版</strong> 构建。下载后请按自身环境修改调整。',
      '欢迎审阅这些文件。可通过 GitHub Issue 或 Pull Request 提交 <strong>匿名性与安全建议</strong>。',
      '点击下方任意链接即可跳转到对应的 GitHub 目录。'
    ]
  };

  var CONFIG = {
    title: '配置索引',
    caption: 'ARKFUTURE 配置文件下载列表，包含软件名称、类型与 GitHub 链接',
    columns: ['软件', '类型', '说明', '配置路径'],
    items: [
      { name: 'i2pd & Tor', tag: '匿名网络', color: 'cyan', description: '匿名网络栈 - i2pd 路由与 Tor 中继配置', path: '/config/i2p-tor/' },
      { name: 'InspIRCd', tag: 'IRC 服务端', color: 'green', description: '模块化 Internet Relay Chat 服务端守护进程', path: '/config/inspircd/' },
      { name: 'ErgoIRCd', tag: 'IRC 服务端', color: 'green', description: '使用 Go 编写的轻量易用 IRC 服务端', path: '/config/ergoircd/' },
      { name: 'HybridIRCd', tag: 'IRC 服务端', color: 'green', description: '高性能混合型 IRC 服务端', path: '/config/hybridircd/' },
      { name: 'ngIRCd', tag: 'IRC 服务端', color: 'green', description: '轻量级 Internet Relay Chat 守护进程', path: '/config/ngircd/' },
      { name: 'Irssi', tag: 'IRC 客户端', color: 'orange', description: '模块化文本模式 IRC 客户端', path: '/config/irssi/' },
      { name: 'Suricata', tag: '网络安全', color: 'cyan', description: '高性能网络入侵检测 / 防御（IDS / IPS）引擎', path: '/config/suricata/' },
      { name: 'Minecraft Server', tag: '游戏服务端', color: 'magenta', description: 'Minecraft 服务器配置', path: '/config/minecraft/' },
      { name: 'Other Configs', tag: '其他', color: 'yellow', description: '其他杂项服务器配置', path: '/config/other/' }
    ]
  };

  var AUDIT = {
    title: '安全审计',
    textPrefix: '我们诚邀您审阅这些',
    textEmphasis: '服务器配置文件',
    textSuffix: '，并针对匿名性、安全性与隐私提出反馈。',
    ctaPrefix: '可通过',
    ctaLinkText: 'GitHub Issues',
    ctaLinkUrl: 'https://github.com/ARKFUTURE/ARKFUTURE.github.io/issues',
    ctaSuffix: '提交反馈。感谢您的贡献。'
  };

  /* ============================================================
   * RENDER LAYER — pure functions building DOM from data
   * ============================================================ */

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        if (key === 'class') node.className = attrs[key];
        else if (key === 'html') node.innerHTML = attrs[key];
        else if (key === 'text') node.textContent = attrs[key];
        else node.setAttribute(key, attrs[key]);
      });
    }
    (children || []).forEach(function (child) {
      if (child) node.appendChild(child);
    });
    return node;
  }

  function renderIntro() {
    var list = el('ul', { class: 'intro-list' });
    INTRO.lines.forEach(function (line) {
      var li = el('li');
      li.innerHTML = line;
      list.appendChild(li);
    });
    return el('section', { class: 'card', 'aria-labelledby': 'instructions-heading' }, [
      el('h2', { class: 'card__title', id: 'instructions-heading', text: INTRO.title }),
      list
    ]);
  }

  function renderConfig() {
    var head = el('thead');
    var headRow = el('tr');
    CONFIG.columns.forEach(function (col, idx) {
      headRow.appendChild(el('th', { scope: 'col', text: col }));
    });
    head.appendChild(headRow);

    var body = el('tbody');
    CONFIG.items.forEach(function (item) {
      var row = el('tr');

      var nameTd = el('td', { class: 'config-name', 'data-label': CONFIG.columns[0], text: item.name });
      row.appendChild(nameTd);

      var typeTd = el('td', { 'data-label': CONFIG.columns[1] });
      typeTd.appendChild(el('span', { class: 'type-tag type-' + item.color, text: item.tag }));
      row.appendChild(typeTd);

      var descTd = el('td', { class: 'config-desc', 'data-label': CONFIG.columns[2], text: item.description });
      row.appendChild(descTd);

      var linkTd = el('td', { 'data-label': CONFIG.columns[3] });
      linkTd.appendChild(el('a', {
        class: 'config-link',
        href: BASE_URL + item.path,
        target: '_blank',
        rel: 'noopener noreferrer',
        text: item.path
      }));
      row.appendChild(linkTd);

      body.appendChild(row);
    });

    return el('section', { class: 'card', 'aria-labelledby': 'config-heading' }, [
      el('h2', { class: 'card__title', id: 'config-heading', text: CONFIG.title }),
      el('table', { class: 'config-table' }, [
        el('caption', { class: 'sr-only', text: CONFIG.caption }),
        head,
        body
      ])
    ]);
  }

  function renderAudit() {
    var textP = el('p', { class: 'audit-text' });
    textP.appendChild(document.createTextNode(AUDIT.textPrefix));
    textP.appendChild(el('span', { class: 'emphasis', text: AUDIT.textEmphasis }));
    textP.appendChild(document.createTextNode(AUDIT.textSuffix));

    var ctaP = el('p', { class: 'audit-cta' });
    ctaP.appendChild(document.createTextNode(AUDIT.ctaPrefix));
    ctaP.appendChild(el('a', {
      href: AUDIT.ctaLinkUrl,
      target: '_blank',
      rel: 'noopener noreferrer',
      text: AUDIT.ctaLinkText
    }));
    ctaP.appendChild(document.createTextNode(AUDIT.ctaSuffix));

    return el('section', { class: 'card audit', 'aria-labelledby': 'audit-heading' }, [
      el('h2', { class: 'card__title', id: 'audit-heading', text: AUDIT.title }),
      textP,
      ctaP
    ]);
  }

  function build() {
    var app = document.getElementById('app');
    var frag = document.createDocumentFragment();
    frag.appendChild(renderIntro());
    frag.appendChild(renderConfig());
    frag.appendChild(renderAudit());
    app.appendChild(frag);
  }

  /* ============================================================
   * PARTICLE FX — ambient neon network (respects reduced motion)
   * ============================================================ */

  function initParticles() {
    var canvas = document.getElementById('particle-canvas');
    if (!canvas) return;
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    var ctx = canvas.getContext('2d');
    var particles = [];
    var max = 50;
    var linkDist = 140;
    var w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makeParticle() {
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 1.8 + 0.5,
        o: Math.random() * 0.5 + 0.12,
        c: Math.random() < 0.5 ? '0, 240, 255' : '176, 38, 255'
      };
    }

    var i, j;
    for (i = 0; i < max; i++) particles.push(makeParticle());

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10 || p.x > w + 10 || p.y < -10 || p.y > h + 10) {
          particles[i] = p = makeParticle();
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.c + ', ' + p.o + ')';
        ctx.fill();
        for (j = i + 1; j < particles.length; j++) {
          var q = particles[j];
          var dx = p.x - q.x;
          var dy = p.y - q.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < linkDist) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = 'rgba(0, 240, 255, ' + ((1 - dist / linkDist) * 0.12) + ')';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  build();
  initParticles();
})();
</script>
</body>
</html>
