####### 路由逻辑 #######

# 标志定义
#!define FLT_ACC 1
#!define FLT_NATS 5
#!define FLB_NATB 6
#!define FLT_MISSED 2

request_route {

    # 1. 反洪水保护 (排除本机)
    if(src_ip!=myself) {
        if($sht(ipban=>$si)!=$null) {
            xlog("L_WARN", "拒绝被屏蔽IP: $si\n");
            exit;
        }
        if (!pike_check_req()) {
            xlog("L_ALERT", "洪水攻击来自 $si:$sp\n");
            $sht(ipban=>$si) = 1;
            exit;
        }
    }

    # 2. Max-Forwards检查
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # 3. 消息完整性检查
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "畸形SIP消息来自 $si:$sp\n");
        exit;
    }

    # 4. NAT检测
    route(NAT_DETECT);

    # 5. 处理会话内消息
        handle_ruri_alias();
    if (has_totag()) {
        if (loose_route()) {
            route(NAT_MANAGE);
            route(RELAY);
        } else {
            sl_send_reply("404", "Not here");
        }
        exit;
    }

    # 6. 处理CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # 7. REGISTER处理
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # 8. OPTIONS处理
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # 9. 主叫认证 (所有请求必须认证)
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "0");
        exit;
    }
    
    # 消费认证头 (REGISTER除外)
    if(!is_method("REGISTER")) {
        consume_credentials();
    }

    # 10. 检查是否中继到外域 (防止成为开放代理)
    if (uri!=myself) {
        sl_send_reply("403", "Not relaying");
        exit;
    }

    # 11. 设置计费标志
    if (is_method("INVITE")) {
        setflag(FLT_ACC);
        dlgs_init("$fu", "$tu", "srcip=$si");
    }

    # 12. 路由到被叫
    route(CALL_ROUTING);
    exit;
}

# NAT检测
route[NAT_DETECT] {
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if(is_first_hop()) {
                set_contact_alias();
            }
        }
        setflag(FLT_NATS);
    }
    return;
}

# NAT管理
route[NAT_MANAGE] {
    if (!isflagset(FLT_NATS)) return;
    
    if (is_request()) {
        if (!has_totag()) {
            add_rr_param(";nat=yes");
        }
    }
    return;
}

# 注册处理
route[REGISTRAR] {
    # 认证
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "0");
        exit;
    }
    
    # 保存注册
    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    
    xlog("L_INFO", "用户 $fU@$fd 注册成功, 来自 $si:$sp\n");
}

# 呼叫路由
route[CALL_ROUTING] {
    # Record-Route放在路由查找之前
    if (is_method("INVITE|SUBSCRIBE|REFER")) {
        record_route();
    }
    
    # 查找被叫位置
    if (!lookup("location")) {
        sl_send_reply("404", "User Not Found");
        exit;
    }
    
    route(RELAY);
}

# 转发
route[RELAY] {
    t_on_failure("MANAGE_FAILURE");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
# 失败路由处理 (未接来电计费)
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }

    # 未接来电: 忙/无人接听/无应答 计入 missed 标志
    if (isflagset(FLT_ACC) && t_check_status("486|480|408")) {
        setflag(FLT_MISSED);
    }

    # 转发失败响应给主叫
    if (!t_relay()) {
        exit;
    }
    exit;
}